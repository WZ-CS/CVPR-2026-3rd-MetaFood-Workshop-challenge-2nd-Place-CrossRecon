pipeline:
  mode: lite
  frame_max_size: 512
  candidate_frames_per_state: 16
  keyframes_per_state: 8
  before_window: [0.0, 0.25]
  after_window: [0.75, 1.0]
  grid_size: 96
  plate_diameter_cm: 20.0
  debug_visualizations: true

fusion:
  gamma: 8.0
  tau: 0.6
  beta_before: 1.0
  beta_after: 1.3
  discrepancy_threshold: 0.5

lite_backend:
  min_food_area_ratio: 0.015
  completion_bias_after: 0.65
  path_b_prior_weight: 0.65

backends:
  segmentation:
    name: groundingdino_sam2
    weights: null
    config: null
  pi3:
    weights: null
    config: null
  generative:
    gpt_image_model: gpt-image-2
    hunyuan_weights: null
    hunyuan_config: null
    api_key_env: OPENAI_API_KEY

