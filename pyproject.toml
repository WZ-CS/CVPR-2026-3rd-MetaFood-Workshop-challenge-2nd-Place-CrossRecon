[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crossrecon"
version = "0.1.0"
description = "CrossRecon: dual-path 3D food reconstruction and cross-validation for MetaFood challenge videos."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "CrossRecon Team"}
]
dependencies = [
  "numpy>=1.20",
  "opencv-python>=4.5",
  "scipy>=1.7",
  "scikit-image>=0.18",
  "Pillow>=8.0",
  "PyYAML>=5.4",
]

[tool.setuptools.packages.find]
where = ["src"]

